[package]
name = "pokemon-import"
version = "0.1.0"
edition = "2021"

[dependencies]
gphoto2 = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 2
