[package]
name = "pokedex"
version = "0.1.0"
edition = "2021"

[lib]
name = "pokedex"
path = "src/lib.rs"

[[bin]]
name = "pokedex"
path = "src/main.rs"

[dependencies]
postgres = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "1"

[profile.release]
opt-level = 2
